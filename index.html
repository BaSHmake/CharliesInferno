<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Чарльз и яйца</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center;
    background: #111; font-family: 'Courier New', monospace; color: #fff;
  }
  .game-container {
    background: #222; padding: 20px; border-radius: 12px;
    box-shadow: 0 0 40px rgba(0,255,0,0.1); text-align: center;
  }
  canvas { display: block; margin: 0 auto; background: #1a1a1a; border: 2px solid #444; border-radius: 8px; }
  .hud {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 4px; font-size: 18px; letter-spacing: 1px;
  }
  .lives span { color: #ff4444; font-size: 22px; margin-right: 2px; }
  .round { color: #aaa; }
  button {
    background: #2a5a2a; color: #fff; border: 2px solid #4a4; padding: 10px 24px;
    font-family: inherit; font-size: 16px; border-radius: 8px; cursor: pointer; margin-top: 12px;
    transition: background 0.15s;
  }
  button:hover { background: #3a7a3a; }
  button:active { transform: scale(0.97); }
  .msg { margin-top: 10px; font-size: 14px; color: #ccc; min-height: 20px; }
  .record { margin-top: 6px; font-size: 14px; color: #ffd700; }
  .combo { margin-top: 4px; font-size: 13px; color: #ff8800; min-height: 16px; }
  .charles-face {
    display: inline-block; width: 22px; height: 22px; background: #fff; border-radius: 50%;
    position: relative; vertical-align: middle; margin-right: 6px;
  }
  .charles-face::before, .charles-face::after {
    content: ''; position: absolute; width: 4px; height: 4px; background: #000; border-radius: 50%; top: 7px;
  }
  .charles-face::before { left: 5px; }
  .charles-face::after { right: 5px; }
  .charles-eye-line { width: 10px; height: 2px; background: #000; position: absolute; bottom: 6px; left: 6px; border-radius: 2px; }
</style>
</head>
<body>
<div class="game-container">
  <div class="hud">
    <div class="lives"><span>❤</span><span id="livesDisplay">❤❤❤</span></div>
    <div class="round">Раунд <span id="roundDisplay">1</span></div>
    <div>Очки: <span id="scoreDisplay">0</span></div>
  </div>
  <canvas id="gameCanvas" width="400" height="500"></canvas>
  <div class="msg" id="message"><span class="charles-face"><span class="charles-eye-line"></span></span> Нажмите «СТАРТ»</div>
  <div class="record">🏆 Рекорд: <span id="recordDisplay">0</span></div>
  <div class="combo" id="comboDisplay"></div>
  <button id="startBtn">СТАРТ</button>
</div>
<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const livesDisplay = document.getElementById('livesDisplay');
  const roundDisplay = document.getElementById('roundDisplay');
  const scoreDisplay = document.getElementById('scoreDisplay');
  const recordDisplay = document.getElementById('recordDisplay');
  const comboDisplay = document.getElementById('comboDisplay');
  const messageEl = document.getElementById('message');

  const LANES = 3;
  const LANE_WIDTH = canvas.width / LANES;
  const PLAYER_Y = canvas.height - 60;
  const PLAYER_W = 36;
  const PLAYER_H = 36;
  const EGG_W = 20;
  const EGG_H = 26;
  const ROTTEN_COLOR = '#6a8a6a';
  const EGG_COLOR = '#f0e8d0';
  const DIAMOND_COLOR = '#aaf0ff';
  const GOLD_COLOR = '#ffd700';
  const BOMB_COLOR = '#3a1a1a';

  let playerLane = 1;
  let lives = 3;
  let round = 1;
  let score = 0;
  let eggs = [];
  let running = false;
  let gameOver = false;
  let spawnInterval = null;
  let currentSpawnMs = 700;

  let combo = 0;
  let comboBest = 0;

  let cheaterMode = false;
  let cheaterLabels = [];

  let charlesBob = 0;
  let charlesScared = 0;

  let record = parseInt(localStorage.getItem('charlesEggRecord') || '0', 10);
  recordDisplay.textContent = record;

  // ===== ЭФФЕКТЫ =====
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  function playTone(freq, duration, type = 'square', volume = 0.08) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  }
  function sfxCatch()   { playTone(880, 0.08, 'square', 0.06); }
  function sfxRotten()  { playTone(120, 0.25, 'sawtooth', 0.12); }
  function sfxDiamond() { playTone(1320, 0.10, 'triangle', 0.08); setTimeout(() => playTone(1760, 0.10, 'triangle', 0.08), 80); }
  function sfxGold()    { playTone(660, 0.1, 'triangle', 0.1); setTimeout(() => playTone(990, 0.1, 'triangle', 0.1), 100); setTimeout(() => playTone(1320, 0.15, 'triangle', 0.1), 200); }
  function sfxBomb()    { playTone(80, 0.4, 'sawtooth', 0.18); }
  function sfxCombo()   { playTone(1000, 0.08, 'square', 0.08); setTimeout(() => playTone(1300, 0.12, 'square', 0.08), 80); }
  function sfxGameOver(){ playTone(200, 0.4, 'sawtooth', 0.15); setTimeout(() => playTone(120, 0.5, 'sawtooth', 0.15), 200); }
  function sfxRecord()  { playTone(880, 0.12, 'triangle', 0.1); setTimeout(() => playTone(1100, 0.12, 'triangle', 0.1), 120); setTimeout(() => playTone(1320, 0.2, 'triangle', 0.1), 240); }

  let particles = [];
  function spawnParticles(x, y, color, count = 10) {
    for (let i = 0; i < count; i++) {
      particles.push({
        x: x, y: y,
        vx: (Math.random() - 0.5) * 5,
        vy: (Math.random() - 0.5) * 5 - 1,
        life: 1, color: color, size: 2 + Math.random() * 3
      });
    }
  }
  function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= 0.03;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  let shake = 0;
  function triggerShake(amount) { shake = Math.max(shake, amount); }
  let flash = 0;
  function triggerFlash(amount) { flash = Math.max(flash, amount); }

  // ===== УПРАВЛЕНИЕ =====
  document.addEventListener('keydown', (e) => {
    if (!running || gameOver) return;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
      playerLane = (playerLane + LANES - 1) % LANES;
    } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
      playerLane = (playerLane + 1) % LANES;
    }
  });

  let touchStartX = null;
  canvas.addEventListener('touchstart', (e) => {
    if (!running || gameOver) return;
    touchStartX = e.touches[0].clientX;
    e.preventDefault();
  }, { passive: false });
  canvas.addEventListener('touchend', (e) => {
    if (!running || gameOver || touchStartX === null) return;
    const touchEndX = e.changedTouches[0].clientX;
    const deltaX = touchEndX - touchStartX;
    const threshold = 30;
    if (Math.abs(deltaX) > threshold) {
      if (deltaX < 0) playerLane = (playerLane + LANES - 1) % LANES;
      else playerLane = (playerLane + 1) % LANES;
    } else {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const tapX = (touchEndX - rect.left) * scaleX;
      const tappedLane = Math.floor(tapX / LANE_WIDTH);
      if (tappedLane >= 0 && tappedLane < LANES) playerLane = tappedLane;
    }
    touchStartX = null;
    e.preventDefault();
  }, { passive: false });

  document.getElementById('startBtn').addEventListener('click', startGame);

  // ===== ИГРА =====
  function startGame() {
    ensureAudio();
    if (spawnInterval) clearInterval(spawnInterval);
    playerLane = 1;
    lives = 3; round = 1; score = 0;
    eggs = []; particles = []; shake = 0; flash = 0;
    combo = 0; comboBest = 0;
    cheaterMode = false; cheaterLabels = [];
    charlesScared = 0;
    running = true; gameOver = false;
    updateHUD();
    comboDisplay.textContent = '';
    messageEl.textContent = 'Ловите хорошие яйца, избегайте гнилых!';
    startSpawning();
    requestAnimationFrame(gameLoop);
  }

  // Плавный рост порога: 100, 140, 180, 220...
  function scoreForNextRound() {
    return 100 + (round - 1) * 40;
  }

  function startSpawning() {
    if (spawnInterval) clearInterval(spawnInterval);

    // Разминка: до 3-го раунда интервал почти не падает
    const warmup = Math.min(round, 3);
    currentSpawnMs = Math.max(380, 700 - (warmup - 1) * 40);

    spawnInterval = setInterval(() => {
      if (!running || gameOver) return;
      const lane = Math.floor(Math.random() * LANES);
      const r = Math.random();

      // Гнилых мягко: 28% → +5% за раунд → максимум 45%
      const rottenChance = Math.min(0.45, 0.28 + (round - 1) * 0.05);
      const goldChance = 0.05;
      const bombChance = 0.04;
      const diamondChance = 0.1;

      let type;
      if (r < bombChance) type = 'bomb';
      else if (r < bombChance + goldChance) type = 'gold';
      else if (r < bombChance + goldChance + rottenChance) type = 'rotten';
      else if (r < bombChance + goldChance + rottenChance + diamondChance) type = 'diamond';
      else type = 'normal';

      // Скорость: первые 3 раунда без ускорения, дальше +0.3 за раунд
      const speedBoost = Math.max(0, round - 3) * 0.3;
      const baseSpeed = 2.2 + Math.random() * 1.2 + speedBoost;
      eggs.push({ lane: lane, y: -EGG_H, type: type, speed: baseSpeed });
    }, currentSpawnMs);
  }

  function updateHUD() {
    livesDisplay.textContent = '❤'.repeat(lives) || '💀';
    roundDisplay.textContent = round;
    scoreDisplay.textContent = score;
  }

  function gameLoop() {
    if (!running) return;
    update();
    draw();
    requestAnimationFrame(gameLoop);
  }

  function update() {
    if (gameOver) return;
    updateParticles();
    charlesBob += 0.05;
    if (charlesScared > 0) charlesScared -= 0.02;

    for (let i = eggs.length - 1; i >= 0; i--) {
      const egg = eggs[i];
      egg.y += egg.speed;
      const eggCenterX = egg.lane * LANE_WIDTH + LANE_WIDTH / 2;
      const playerCenterX = playerLane * LANE_WIDTH + LANE_WIDTH / 2;
      const playerTop = PLAYER_Y - PLAYER_H / 2;
      const playerBottom = PLAYER_Y + PLAYER_H / 2;

      if (egg.y + EGG_H >= playerTop && egg.y <= playerBottom &&
          Math.abs(eggCenterX - playerCenterX) < LANE_WIDTH * 0.4) {

        if (egg.type === 'rotten') {
          lives--; if (lives < 0) lives = 0;
          combo = 0;
          updateHUD();
          sfxRotten(); triggerShake(8); triggerFlash(0.6);
          charlesScared = 1;
          if (navigator.vibrate) navigator.vibrate(120);
          spawnParticles(eggCenterX, playerTop, '#6a8a6a');
          eggs.splice(i, 1);
          if (lives <= 0) { triggerGameOver(); return; }
          continue;
        } else if (egg.type === 'bomb') {
          lives -= 2; if (lives < 0) lives = 0;
          combo = 0;
          updateHUD();
          sfxBomb(); triggerShake(18); triggerFlash(1);
          charlesScared = 1;
          if (navigator.vibrate) navigator.vibrate([200, 80, 200]);
          spawnParticles(eggCenterX, playerTop, '#ff4400', 20);
          eggs.splice(i, 1);
          if (lives <= 0) { triggerGameOver(); return; }
          continue;
        } else {
          let points = 10;
          if (egg.type === 'diamond') points = 20;
          if (egg.type === 'gold') {
            points = 15;
            if (lives < 5) { lives++; updateHUD(); }
            sfxGold();
            spawnParticles(eggCenterX, playerTop, GOLD_COLOR, 15);
          } else if (egg.type === 'diamond') {
            sfxDiamond();
            spawnParticles(eggCenterX, playerTop, DIAMOND_COLOR);
          } else {
            sfxCatch();
            spawnParticles(eggCenterX, playerTop, EGG_COLOR);
          }
          score += points;
          combo++;
          if (combo > comboBest) comboBest = combo;

          if (combo > 0 && combo % 5 === 0) {
            score += 30;
            sfxCombo();
            comboDisplay.textContent = `🔥 Комбо x${combo}! +30`;
            triggerFlash(0.15);
          } else {
            comboDisplay.textContent = combo > 1 ? `Комбо: ${combo}` : '';
          }

          updateHUD();
          eggs.splice(i, 1);
          continue;
        }
      }

      if (egg.y > canvas.height + 20) {
        if (egg.type !== 'rotten' && egg.type !== 'bomb') {
          lives--; if (lives < 0) lives = 0;
          combo = 0;
          comboDisplay.textContent = '';
          updateHUD();
          sfxRotten(); triggerFlash(0.4);
          charlesScared = 1;
          if (navigator.vibrate) navigator.vibrate(80);
          if (lives <= 0) { triggerGameOver(); return; }
        }
        eggs.splice(i, 1);
      }
    }

    if (score >= scoreForNextRound()) {
      round++;
      updateHUD();
      startSpawning();
      messageEl.textContent = round <= 3
        ? `Раунд ${round}. Разминка продолжается.`
        : `Раунд ${round}! Постепенно ускоряемся.`;
      triggerFlash(0.2);
    }
  }

  function triggerGameOver() {
    // Пасхалка CHEATER
    if (score < 30) {
      triggerCheater();
      return;
    }

    gameOver = true; running = false;
    if (spawnInterval) clearInterval(spawnInterval);
    sfxGameOver(); triggerShake(15); triggerFlash(0.8);
    if (navigator.vibrate) navigator.vibrate([150, 80, 150]);

    if (score > record) {
      record = score;
      localStorage.setItem('charlesEggRecord', record);
      recordDisplay.textContent = record;
      sfxRecord();
      messageEl.textContent = `🏆 Новый рекорд: ${score}! Комбо-макс: ${comboBest}. Нажмите «Начать / Заново».`;
    } else {
      messageEl.textContent = `💀 Чарльз вас укусил! Очки: ${score}. Рекорд: ${record}. Нажмите «Начать / Заново».`;
    }
  }

  function triggerCheater() {
    cheaterMode = true;
    running = false;
    gameOver = true;
    if (spawnInterval) clearInterval(spawnInterval);

    cheaterLabels = [];
    for (let i = 0; i < 30; i++) {
      cheaterLabels.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: 14 + Math.random() * 26,
        color: Math.random() < 0.5 ? '#ff2020' : '#ffffff',
        alpha: 0.5 + Math.random() * 0.5
      });
    }

    sfxBomb();
    triggerShake(20);
    triggerFlash(1);
    if (navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 300]);
    messageEl.textContent = '💀 CHEATER! Чарльз знает, что ты сделал. Нажми «Начать / Заново».';
  }

  function draw() {
    ctx.save();
    if (shake > 0.5) {
      const dx = (Math.random() - 0.5) * shake;
      const dy = (Math.random() - 0.5) * shake;
      ctx.translate(dx, dy);
      shake *= 0.85;
      if (shake < 0.5) shake = 0;
    }

    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(-50, -50, canvas.width + 100, canvas.height + 100);

    for (let i = 0; i <= LANES; i++) {
      ctx.beginPath();
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 1;
      ctx.moveTo(i * LANE_WIDTH, 0);
      ctx.lineTo(i * LANE_WIDTH, canvas.height);
      ctx.stroke();
    }

    eggs.forEach(egg => {
      const x = egg.lane * LANE_WIDTH + LANE_WIDTH / 2 - EGG_W / 2;
      const y = egg.y;
      if (egg.type === 'normal') {
        ctx.fillStyle = EGG_COLOR;
        ctx.beginPath();
        ctx.ellipse(x + EGG_W / 2, y + EGG_H / 2, EGG_W / 2, EGG_H / 2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#aaa'; ctx.lineWidth = 1; ctx.stroke();
      } else if (egg.type === 'rotten') {
        ctx.fillStyle = ROTTEN_COLOR;
        ctx.beginPath();
        ctx.ellipse(x + EGG_W / 2, y + EGG_H / 2, EGG_W / 2, EGG_H / 2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#3a5a3a'; ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(x + 4, y + 8); ctx.lineTo(x + 12, y + 12); ctx.lineTo(x + 8, y + 20);
        ctx.stroke();
      } else if (egg.type === 'diamond') {
        ctx.fillStyle = DIAMOND_COLOR;
        ctx.beginPath();
        ctx.moveTo(x + EGG_W / 2, y);
        ctx.lineTo(x + EGG_W, y + EGG_H / 2);
        ctx.lineTo(x + EGG_W / 2, y + EGG_H);
        ctx.lineTo(x, y + EGG_H / 2);
        ctx.closePath();
        ctx.fill();
      } else if (egg.type === 'gold') {
        ctx.fillStyle = GOLD_COLOR;
        ctx.beginPath();
        ctx.ellipse(x + EGG_W / 2, y + EGG_H / 2, EGG_W / 2, EGG_H / 2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.beginPath();
        ctx.ellipse(x + EGG_W / 2 - 4, y + EGG_H / 2 - 5, 3, 5, 0, 0, Math.PI * 2);
        ctx.fill();
      } else if (egg.type === 'bomb') {
        ctx.fillStyle = BOMB_COLOR;
        ctx.beginPath();
        ctx.arc(x + EGG_W / 2, y + EGG_H / 2, EGG_W / 2 + 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ff4400';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x + EGG_W / 2, y);
        ctx.lineTo(x + EGG_W / 2 + 4, y - 8);
        ctx.stroke();
        ctx.fillStyle = '#ffaa00';
        ctx.beginPath();
        ctx.arc(x + EGG_W / 2 + 4, y - 8, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    });

    const px = playerLane * LANE_WIDTH + LANE_WIDTH / 2;
    const py = PLAYER_Y + Math.sin(charlesBob) * 2;
    const eyeOffset = charlesScared > 0 ? 1.5 : 0;

    ctx.fillStyle = '#3aa0a0';
    ctx.fillRect(px - PLAYER_W / 2, py - PLAYER_H / 2, PLAYER_W, PLAYER_H);

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(px, py - PLAYER_H / 2 - 6, 12, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(px - 4, py - PLAYER_H / 2 - 8, 2.5 + eyeOffset, 0, Math.PI * 2);
    ctx.arc(px + 4, py - PLAYER_H / 2 - 8, 2.5 + eyeOffset, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#aa8844';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(px, py - PLAYER_H / 2 - 22, 10, 0, Math.PI);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(px - 12, py - PLAYER_H / 2 - 20);
    ctx.lineTo(px - 12, py - PLAYER_H / 2 - 12);
    ctx.lineTo(px + 12, py - PLAYER_H / 2 - 12);
    ctx.lineTo(px + 12, py - PLAYER_H / 2 - 20);
    ctx.stroke();

    particles.forEach(p => {
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    });
    ctx.globalAlpha = 1;

    if (gameOver && !cheaterMode) {
      ctx.fillStyle = 'rgba(150, 0, 0, 0.25)';
      ctx.fillRect(-50, -50, canvas.width + 100, canvas.height + 100);
    }

    if (cheaterMode) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
      ctx.fillRect(-50, -50, canvas.width + 100, canvas.height + 100);
      cheaterLabels.forEach(label => {
        ctx.globalAlpha = label.alpha;
        ctx.fillStyle = label.color;
        ctx.font = `bold ${label.size}px 'Courier New', monospace`;
        ctx.fillText('CHEATER', label.x, label.y);
      });
      ctx.globalAlpha = 1;
    }

    if (flash > 0.01) {
      ctx.fillStyle = `rgba(255, 40, 40, ${flash})`;
      ctx.fillRect(-50, -50, canvas.width + 100, canvas.height + 100);
      flash *= 0.88;
      if (flash < 0.01) flash = 0;
    }

    ctx.restore();
  }

  draw();
</script>
</body>
</html>
