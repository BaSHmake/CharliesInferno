<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Чарльз и яйца</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center;
    background: #111; font-family: 'Courier New', monospace; color: #fff; padding: 10px;
  }
  .game-container {
    background: #222; padding: 15px; border-radius: 12px;
    box-shadow: 0 0 40px rgba(0,255,0,0.1); text-align: center;
    width: 100%; max-width: 440px; position: relative;
  }
  canvas { display: block; margin: 0 auto; background: #1a1a1a; border: 2px solid #444; border-radius: 8px; touch-action: none; width: 100%; max-width: 400px; height: auto; }
  .hud { display: flex; justify-content: space-between; align-items: center; padding: 10px 4px; font-size: 16px; letter-spacing: 1px; }
  .lives span { color: #ff4444; font-size: 20px; margin-right: 2px; }
  .round { color: #aaa; }
  button { background: #2a5a2a; color: #fff; border: 2px solid #4a4; padding: 10px 20px; font-family: inherit; font-size: 16px; border-radius: 8px; cursor: pointer; margin-top: 10px; transition: background 0.15s, transform 0.1s; }
  button:hover { background: #3a7a3a; }
  button:active { transform: scale(0.97); }
  .msg { margin-top: 10px; font-size: 14px; color: #ccc; min-height: 20px; }
  .record { margin-top: 6px; font-size: 13px; color: #ffd700; }
  .combo { margin-top: 4px; font-size: 13px; color: #ff8800; min-height: 16px; }

  /* Меню */
  .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(20, 20, 20, 0.98); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; border-radius: 12px; z-index: 10; padding: 15px; overflow-y: auto; }
  .screen h2 { margin: 0 0 10px; color: #fff; font-size: 20px; }

  .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; max-width: 360px; margin-bottom: 10px; }
  .mode-btn { padding: 8px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; border: 2px solid #555; transition: 0.2s; text-align: center; }
  .mode-btn:hover { transform: scale(1.03); }
  .mode-btn small { display: block; font-size: 10px; font-weight: normal; margin-top: 4px; opacity: 0.8; }
  .mode-classic { background: #1a3a1a; border-color: #4a4; color: #ccffcc; }
  .mode-hardcore { background: #3a1a1a; border-color: #a33; color: #ffcccc; }
  .mode-chaos { background: #3a2a1a; border-color: #ca3; color: #ffeebb; }
  .mode-one { background: #1a1a3a; border-color: #44a; color: #ccccff; }
  .mode-five { background: #2a1a3a; border-color: #a4f; color: #f0ccff; }
  .mode-double { background: #3a1a2a; border-color: #f4a; color: #ffccf0; }

  .nav-btn { background: #333; border-color: #777; margin-top: 0; margin-bottom: 10px; width: 100%; max-width: 360px; }

  /* Вкладки скинов */
  .skin-tabs { display: flex; gap: 5px; width: 100%; max-width: 360px; margin-bottom: 10px; }
  .skin-tab { flex: 1; padding: 8px; background: #333; border: 1px solid #555; border-radius: 6px; font-size: 12px; cursor: pointer; color: #aaa; }
  .skin-tab.active { background: #555; color: #fff; border-color: #aaa; }
  .skin-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; max-width: 360px; }
  .skin-item { background: #333; border: 2px solid #555; border-radius: 8px; padding: 5px; text-align: center; cursor: pointer; position: relative; }
  .skin-item.locked { opacity: 0.5; cursor: not-allowed; }
  .skin-item.active { border-color: #ffd700; box-shadow: 0 0 10px #ffd700; }
  .skin-preview { width: 40px; height: 40px; margin: 0 auto 5px; position: relative; }
  .skin-name { font-size: 10px; color: #fff; line-height: 1.1; word-break: break-word; }
  .skin-desc { font-size: 9px; color: #aaa; margin-top: 2px; }

  @media (max-width: 420px) {
    .game-container { padding: 8px; }
    .skin-grid { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>
<div class="game-container">
  <div class="hud">
    <div class="lives"><span>❤</span><span id="livesDisplay">❤❤❤</span></div>
    <div class="round">Раунд <span id="roundDisplay">1</span></div>
    <div>Очки: <span id="scoreDisplay">0</span></div>
  </div>

  <canvas id="gameCanvas" width="400" height="500"></canvas>

  <div class="msg" id="message">Выберите режим</div>
  <div class="record" id="recordText">🏆 Рекорд: 0</div>
  <div class="combo" id="comboDisplay"></div>

  <button id="startBtn" style="display:none;">Начать / Заново</button>

  <!-- ЭКРАН: ВЫБОР РЕЖИМА -->
  <div class="screen" id="modeScreen">
    <h2>Выберите режим</h2>
    <div class="mode-grid">
      <div class="mode-btn mode-classic" onclick="selectMode('classic')">🟢 КЛАССИКА<small>Обычная игра</small></div>
      <div class="mode-btn mode-hardcore" onclick="selectMode('hardcore')">🔴 ХАРДКОР<small>Без разминки</small></div>
      <div class="mode-btn mode-chaos" onclick="selectMode('chaos')">🌪️ ХАОС<small>Двойные яйца</small></div>
      <div class="mode-btn mode-one" onclick="selectMode('one')">💀 JUST ONE<small>1 жизнь</small></div>
      <div class="mode-btn mode-five" onclick="selectMode('five')">🖐️ 5X<small>5 дорожек</small></div>
      <div class="mode-btn mode-double" onclick="selectMode('double')">👥 ДВОЙНАЯ<small>2 Чарльза</small></div>
    </div>
    <button class="nav-btn" onclick="openSkins()">🎨 Меню скинов</button>
  </div>

  <!-- ЭКРАН: ВЫБОР СКИНА -->
  <div class="screen" id="skinScreen" style="display:none;">
    <h2>Скины <span id="secretTap" style="cursor:pointer; opacity:0.3;">👤</span></h2>
    <div class="skin-tabs">
      <button class="skin-tab active" onclick="switchTab('colors', this)">Цвета</button>
      <button class="skin-tab" onclick="switchTab('modes', this)">Режимы</button>
      <button class="skin-tab" onclick="switchTab('achiev', this)">Ачивки</button>
    </div>
    <div class="skin-grid" id="skinGrid"></div>
    <button class="nav-btn" onclick="closeSkins()" style="margin-top:15px;">Назад</button>
  </div>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const livesDisplay = document.getElementById('livesDisplay');
  const roundDisplay = document.getElementById('roundDisplay');
  const scoreDisplay = document.getElementById('scoreDisplay');
  const recordText = document.getElementById('recordText');
  const comboDisplay = document.getElementById('comboDisplay');
  const messageEl = document.getElementById('message');
  const modeScreen = document.getElementById('modeScreen');
  const skinScreen = document.getElementById('skinScreen');
  const startBtn = document.getElementById('startBtn');

  const PLAYER_Y = canvas.height - 60;
  const PLAYER_W = 30;
  const PLAYER_H = 30;
  const EGG_W = 18;
  const EGG_H = 22;

  const ROTTEN_COLOR = '#6a8a6a';
  const EGG_COLOR = '#f0e8d0';
  const DIAMOND_COLOR = '#aaf0ff';
  const GOLD_COLOR = '#ffd700';
  const BOMB_COLOR = '#3a1a1a';

  let currentMode = 'classic';
  let LANES = 3;
  let LANE_WIDTH = canvas.width / LANES;
  let isDouble = false;
  let playerLane = 1, player2Lane = 1;
  let lives = 3, round = 1, score = 0;
  let eggs = [], running = false, gameOver = false, spawnInterval = null, currentSpawnMs = 700;
  let combo = 0, comboBest = 0, cheaterMode = false, cheaterLabels = [];
  let charlesBob = 0, charlesScared = 0;
  let shake = 0, flash = 0;

  // ===== СКИНЫ И ДОСТИЖЕНИЯ =====
  let records = JSON.parse(localStorage.getItem('charlesEgg_records') || '{"classic":0,"hardcore":0,"chaos":0,"one":0,"five":0,"double":0}');
  let stats = JSON.parse(localStorage.getItem('charlesEgg_stats') || '{"totalCombo":0,"eggs":0,"rotten":0,"gold":0,"bomb":0,"diamond":0,"cheater":false,"secret":false}');
  let unlockedSkins = JSON.parse(localStorage.getItem('charlesEgg_unlocked') || '["default","invisible"]');
  let currentSkin = localStorage.getItem('charlesEgg_activeSkin') || 'default';

  // Описание всех скинов
  const SKINS = {
    'default': { name: 'Стандарт', tab: 'colors', body: '#3aa0a0', head: '#ffffff', req: 'Бесплатно', check: () => true },
    'invisible': { name: 'Невидимый', tab: 'colors', body: 'transparent', head: 'transparent', req: 'Бесплатно', check: () => true },
    'blue': { name: 'Синий', tab: 'colors', body: '#2266ff', head: '#ffffff', req: '100 очк. Классика', check: () => records.classic >= 100 },
    'green': { name: 'Зелёный', tab: 'colors', body: '#22cc22', head: '#ffffff', req: '250 очк. Классика', check: () => records.classic >= 250 },
    'yellow': { name: 'Жёлтый', tab: 'colors', body: '#ffcc00', head: '#ffffff', req: '500 очк. Классика', check: () => records.classic >= 500 },
    'orange': { name: 'Оранжевый', tab: 'colors', body: '#ff8800', head: '#ffffff', req: '1000 очк. Классика', check: () => records.classic >= 1000 },
    'red': { name: 'Красный', tab: 'colors', body: '#ff2222', head: '#ffffff', req: '1500 очк. Классика', check: () => records.classic >= 1500 },
    'purple': { name: 'Фиолетовый', tab: 'colors', body: '#aa22ff', head: '#ffffff', req: '2000 очк. Классика', check: () => records.classic >= 2000 },
    'black': { name: 'Чёрный', tab: 'colors', body: '#222222', head: '#ffffff', req: '2500 очк. Классика', check: () => records.classic >= 2500 },
    'white_star': { name: 'Белая звезда', tab: 'colors', body: '#ffffff', head: '#ffffff', star: '#ffaa00', req: '3000 очк. Классика', check: () => records.classic >= 3000 },
    'rainbow': { name: 'Радужный', tab: 'colors', body: 'rainbow', head: '#ffffff', req: '3500 очк. Классика', check: () => records.classic >= 3500 },

    'double2': { name: 'Две головы', tab: 'modes', body: '#3aa0a0', head: '#ffffff', heads: 2, req: '500 очк. Двойной', check: () => records.double >= 500 },
    'double3': { name: 'Три головы', tab: 'modes', body: '#3aa0a0', head: '#ffffff', heads: 3, req: '1000 очк. Двойной', check: () => records.double >= 1000 },
    'scream': { name: 'Крик', tab: 'modes', body: '#3aa0a0', head: '#ffffff', scream: true, req: '1500 очк. Двойной', check: () => records.double >= 1500 },

    'hard_red': { name: 'Красный Чарльз', tab: 'modes', body: '#ff0000', head: '#ffffff', req: '500 очк. Хардкор', check: () => records.hardcore >= 500 },
    'demon': { name: 'Демон', tab: 'modes', body: '#550000', head: '#ff2222', horns: true, req: '1000 очк. Хардкор', check: () => records.hardcore >= 1000 },
    'archangel': { name: 'Архангел', tab: 'modes', body: '#ffffff', head: '#ffffaa', halo: true, req: '1500 очк. Хардкор', check: () => records.hardcore >= 1500 },

    'chaos_purp': { name: 'Фиол-чёрный', tab: 'modes', body: '#220033', head: '#6600aa', req: '500 очк. Хаос', check: () => records.chaos >= 500 },
    'chaos_ghost': { name: 'Фиол. призрак', tab: 'modes', body: 'rgba(150,0,255,0.5)', head: 'rgba(200,150,255,0.5)', req: '1000 очк. Хаос', check: () => records.chaos >= 1000 },
    'void_crystal': { name: 'Кристалл', tab: 'modes', body: '#220033', head: '#aa22ff', crystal: true, req: '1500 очк. Хаос', check: () => records.chaos >= 1500 },

    'eye3': { name: 'Третий глаз', tab: 'modes', body: '#3aa0a0', head: '#ffffff', eyes: 3, req: '500 очк. 5X', check: () => records.five >= 500 },
    'eye5': { name: 'Пятиглазый', tab: 'modes', body: '#3aa0a0', head: '#ffffff', eyes: 5, req: '1000 очк. 5X', check: () => records.five >= 1000 },
    'eye_all': { name: 'Весь в глазах', tab: 'modes', body: '#ffffff', head: '#ffffff', eyes: 'all', req: '1500 очк. 5X', check: () => records.five >= 1500 },

    'faceless': { name: 'Без лица', tab: 'modes', body: '#3aa0a0', head: '#ffffff', noFace: true, req: '500 очк. Just One', check: () => records.one >= 500 },
    'big_head': { name: 'Большая голова', tab: 'modes', body: '#3aa0a0', head: '#ffffff', bigHead: true, req: '1000 очк. Just One', check: () => records.one >= 1000 },
    'skeleton': { name: 'Скелет', tab: 'modes', body: '#dddddd', head: '#ffffff', skeleton: true, req: '1500 очк. Just One', check: () => records.one >= 1500 },

    'fighter': { name: 'Боец', tab: 'achiev', body: '#886644', head: '#ffffff', req: '20 комбо', check: () => stats.totalCombo >= 20 },
    'soldier': { name: 'Солдат', tab: 'achiev', body: '#556655', head: '#ffffff', req: '50 комбо', check: () => stats.totalCombo >= 50 },
    'knight': { name: 'Рыцарь', tab: 'achiev', body: '#aaaaaa', head: '#ffffff', req: '80 комбо', check: () => stats.totalCombo >= 80 },
    'supercomp': { name: 'Суперкомп', tab: 'achiev', body: '#222222', head: '#00ff00', req: '111 комбо (сумма)', check: () => stats.totalCombo >= 111 },

    'egg_skin': { name: 'Яйцо', tab: 'achiev', body: '#f0e8d0', head: '#f0e8d0', eggShape: true, req: 'Поймать 100 яиц', check: () => stats.eggs >= 100 },
    'rotten_skin': { name: 'Тухлое яйцо', tab: 'achiev', body: '#6a8a6a', head: '#6a8a6a', eggShape: true, req: '10 тухлых', check: () => stats.rotten >= 10 },
    'gold_skin': { name: 'Золотое яйцо', tab: 'achiev', body: '#ffd700', head: '#ffd700', eggShape: true, req: '15 золотых', check: () => stats.gold >= 15 },
    'bomb_skin': { name: 'Бомбик', tab: 'achiev', body: '#3a1a1a', head: '#3a1a1a', bombShape: true, req: '3 бомбы', check: () => stats.bomb >= 3 },
    'diamond_skin': { name: 'Алмазный', tab: 'achiev', body: '#aaf0ff', head: '#aaf0ff', crystal: true, req: '25 алмазов', check: () => stats.diamond >= 25 },

    'dark_knight': { name: 'Тёмный рыцарь', tab: 'achiev', body: '#111111', head: '#333333', req: 'Секрет', check: () => stats.secret },
    'hacker': { name: 'Хакер', tab: 'achiev', body: '#00ff00', head: '#000000', req: 'CHEATER', check: () => stats.cheater }
  };

  // ===== ЭФФЕКТЫ =====
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  function playTone(freq, duration, type = 'square', volume = 0.08) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
  }
  function sfxCatch()   { playTone(880, 0.08, 'square', 0.06); }
  function sfxRotten()  { playTone(120, 0.25, 'sawtooth', 0.12); }
  function sfxDiamond() { playTone(1320, 0.10, 'triangle', 0.08); setTimeout(() => playTone(1760, 0.10, 'triangle', 0.08), 80); }
  function sfxGold()    { playTone(660, 0.1, 'triangle', 0.1); setTimeout(() => playTone(990, 0.1, 'triangle', 0.1), 100); setTimeout(() => playTone(1320, 0.15, 'triangle', 0.1), 200); }
  function sfxBomb()    { playTone(80, 0.4, 'sawtooth', 0.18); }
  function sfxCombo()   { playTone(1000, 0.08, 'square', 0.08); setTimeout(() => playTone(1300, 0.12, 'square', 0.08), 80); }
  function sfxGameOver(){ playTone(200, 0.4, 'sawtooth', 0.15); setTimeout(() => playTone(120, 0.5, 'sawtooth', 0.15), 200); }
  function sfxRecord()  { playTone(880, 0.12, 'triangle', 0.1); setTimeout(() => playTone(1100, 0.12, 'triangle', 0.1), 120); setTimeout(() => playTone(1320, 0.2, 'triangle', 0.1), 240); }
  function sfxUnlock()  { playTone(660, 0.1, 'square', 0.08); setTimeout(() => playTone(880, 0.1, 'square', 0.08), 80); setTimeout(() => playTone(1320, 0.2, 'square', 0.08), 160); }

  let particles = [];
  function spawnParticles(x, y, color, count = 10) {
    for (let i = 0; i < count; i++) particles.push({ x, y, vx: (Math.random()-0.5)*5, vy: (Math.random()-0.5)*5-1, life: 1, color, size: 2+Math.random()*3 });
  }
  function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= 0.03;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }
  function triggerShake(amount) { shake = Math.max(shake, amount); }
  function triggerFlash(amount) { flash = Math.max(flash, amount); }

  // ===== УПРАВЛЕНИЕ =====
  document.addEventListener('keydown', (e) => {
    if (!running || gameOver) return;
    if (isDouble) {
      if (['a','A','ф','Ф'].includes(e.key)) playerLane = (playerLane + 1) % 2;
      if (['d','D','в','В'].includes(e.key)) playerLane = (playerLane + 1) % 2;
      if (e.key === 'ArrowLeft') player2Lane = (player2Lane + 1) % 2;
      if (e.key === 'ArrowRight') player2Lane = (player2Lane + 1) % 2;
    } else {
      if (['ArrowLeft','a','A','ф','Ф'].includes(e.key)) playerLane = (playerLane + LANES - 1) % LANES;
      else if (['ArrowRight','d','D','в','В'].includes(e.key)) playerLane = (playerLane + 1) % LANES;
    }
  });

  canvas.addEventListener('touchstart', (e) => { e.preventDefault(); }, { passive: false });
  canvas.addEventListener('touchend', (e) => {
    if (!running || gameOver) return;
    const touchEndX = e.changedTouches[0].clientX;
    const rect = canvas.getBoundingClientRect();
    const tapX = (touchEndX - rect.left) * (canvas.width / rect.width);

    if (isDouble) {
      const isLeftSide = tapX < canvas.width / 2;
      const tappedLane = Math.floor(tapX / LANE_WIDTH);
      if (isLeftSide && tappedLane < 2) playerLane = tappedLane;
      else if (!isLeftSide && tappedLane >= 2) player2Lane = tappedLane - 2;
    } else {
      const tappedLane = Math.floor(tapX / LANE_WIDTH);
      if (tappedLane >= 0 && tappedLane < LANES) playerLane = tappedLane;
    }
    e.preventDefault();
  }, { passive: false });

  // ===== МЕНЮ И СКИНЫ =====
  window.openSkins = function() { modeScreen.style.display = 'none'; skinScreen.style.display = 'flex'; renderSkins(); };
  window.closeSkins = function() { skinScreen.style.display = 'none'; modeScreen.style.display = 'flex'; };

  let currentTab = 'colors';
  window.switchTab = function(tab, btn) {
    currentTab = tab;
    document.querySelectorAll('.skin-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderSkins();
  };

  let secretTaps = 0;
  document.getElementById('secretTap').addEventListener('click', () => {
    secretTaps++;
    if (secretTaps >= 5) {
      if (!stats.secret) {
        stats.secret = true; saveStats();
        sfxUnlock(); alert('Секретный скин "Тёмный рыцарь" разблокирован!');
        renderSkins();
      }
      secretTaps = 0;
    }
    setTimeout(() => { secretTaps = 0; }, 1500);
  });

  function saveStats() {
    localStorage.setItem('charlesEgg_stats', JSON.stringify(stats));
    localStorage.setItem('charlesEgg_unlocked', JSON.stringify(unlockedSkins));
    localStorage.setItem('charlesEgg_activeSkin', currentSkin);
  }

  function checkUnlocks() {
    let newUnlock = false;
    for (let id in SKINS) {
      if (!unlockedSkins.includes(id) && SKINS[id].check()) {
        unlockedSkins.push(id);
        newUnlock = true;
      }
    }
    if (newUnlock) { saveStats(); sfxUnlock(); }
  }

  function renderSkins() {
    const grid = document.getElementById('skinGrid');
    grid.innerHTML = '';
    checkUnlocks();

    for (let id in SKINS) {
      const skin = SKINS[id];
      if (skin.tab !== currentTab) continue;

      const isUnlocked = unlockedSkins.includes(id);
      const isActive = currentSkin === id;
      const div = document.createElement('div');
      div.className = `skin-item ${isUnlocked ? '' : 'locked'} ${isActive ? 'active' : ''}`;

      let bgStyle = skin.body;
      if (bgStyle === 'rainbow') bgStyle = 'linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet)';
      if (bgStyle === 'transparent') bgStyle = 'repeating-linear-gradient(45deg, #333, #333 5px, #222 5px, #222 10px)';

      let previewHtml = `<div class="skin-preview" style="background:${bgStyle}; border-radius:${skin.eggShape ? '50% 50% 50% 50% / 60% 60% 40% 40%' : (skin.bombShape ? '50%' : '4px')}; border: ${skin.head && skin.head !== 'transparent' ? '2px solid '+skin.head : 'none'};"></div>`;

      div.innerHTML = `${previewHtml}<div class="skin-name">${skin.name}</div><div class="skin-desc">${isUnlocked ? (isActive ? 'Выбран' : 'Доступен') : skin.req}</div>`;

      if (isUnlocked) {
        div.onclick = () => { currentSkin = id; saveStats(); renderSkins(); };
      }
      grid.appendChild(div);
    }
  }

  // ===== ВЫБОР РЕЖИМА =====
  window.selectMode = function(mode) {
    currentMode = mode;
    isDouble = (mode === 'double');
    if (mode === 'five') LANES = 5; else if (mode === 'double') LANES = 4; else LANES = 3;
    LANE_WIDTH = canvas.width / LANES;
    lives = (mode === 'one') ? 1 : 3;
    playerLane = isDouble ? 0 : Math.floor(LANES / 2);
    if (playerLane < 0) playerLane = 0;
    player2Lane = 0;

    modeScreen.style.display = 'none';
    startBtn.style.display = 'inline-block';
    updateRecordDisplay();
    updateHUD();
    messageEl.innerHTML = 'Нажмите «Начать / Заново»';
  };

  function updateRecordDisplay() {
    const names = { classic: 'Классика', hardcore: 'Хардкор', chaos: 'Хаос', one: 'Just One', five: '5X', double: 'Двойная' };
    recordText.textContent = `🏆 Рекорд (${names[currentMode]}): ${records[currentMode] || 0}`;
  }

  startBtn.addEventListener('click', startGame);

  // ===== ИГРА =====
  function startGame() {
    ensureAudio();
    if (spawnInterval) clearInterval(spawnInterval);

    playerLane = isDouble ? 0 : Math.floor(LANES / 2);
    player2Lane = 0;
    lives = (currentMode === 'one') ? 1 : 3;
    round = 1; score = 0;
    eggs = []; particles = []; shake = 0; flash = 0;
    combo = 0; comboBest = 0;
    cheaterMode = false; cheaterLabels = []; charlesScared = 0;

    running = true; gameOver = false;
    updateHUD();
    comboDisplay.textContent = '';
    messageEl.textContent = 'Игра началась!';
    startSpawning();
    requestAnimationFrame(gameLoop);
  }

  function scoreForNextRound() {
    if (currentMode === 'one') return 50 + (round - 1) * 30;
    return 100 + (round - 1) * 40;
  }

  function startSpawning() {
    if (spawnInterval) clearInterval(spawnInterval);
    let baseMs = 700;
    if (currentMode === 'hardcore') baseMs = 600;
    if (currentMode === 'chaos') baseMs = 550;
    if (currentMode === 'double') baseMs = 650;

    const warmup = currentMode === 'classic' ? Math.min(round, 3) : round;
    currentSpawnMs = Math.max(250, baseMs - (warmup - 1) * 40);

    function isLaneFree(targetLane, yPos, minDist = 80) {
      for (let e of eggs) {
        if (e.lane === targetLane && Math.abs(e.y - yPos) < minDist) return false;
      }
      return true;
    }
    function findFreeLane(startLane, yPos, lanesArray) {
      const order = [startLane];
      for (let l of lanesArray) {
        if (l !== startLane) order.push(l);
      }
      for (let lane of order) {
        if (isLaneFree(lane, yPos)) return lane;
      }
      return -1;
    }

    spawnInterval = setInterval(() => {
      if (!running || gameOver) return;

      const r = Math.random();
      let rottenChance = Math.min(0.45, 0.28 + (round - 1) * 0.05);
      if (currentMode === 'one') rottenChance = Math.min(0.35, 0.20 + (round - 1) * 0.04);
      if (currentMode === 'hardcore') rottenChance = Math.min(0.70, 0.30 + (round - 1) * 0.06);

      let type;
      if (currentMode !== 'one' && r < 0.04) type = 'bomb';
      else if (currentMode !== 'one' && r < 0.09) type = 'gold';
      else if (r < 0.09 + rottenChance) type = 'rotten';
      else if (r < 0.09 + rottenChance + 0.10) type = 'diamond';
      else type = 'normal';

      let speedBoost = 0;
      if (currentMode === 'hardcore') speedBoost = (round - 1) * 0.5;
      else if (currentMode === 'chaos') speedBoost = (round - 1) * 0.4;
      else speedBoost = Math.max(0, round - 3) * 0.3;

      const speed = 2.2 + Math.random() * 1.2 + speedBoost;
      const finalSpeed = currentMode === 'five' ? speed * 0.85 : speed;

      let availableLanes = [];
      if (isDouble) {
        const isLeft = Math.random() < 0.5;
        availableLanes = isLeft ? [0, 1] : [2, 3];
      } else {
        for (let i = 0; i < LANES; i++) availableLanes.push(i);
      }

      const startLane = availableLanes[Math.floor(Math.random() * availableLanes.length)];
      const spawnY = -EGG_H;
      const targetLane = findFreeLane(startLane, spawnY, availableLanes);

      if (targetLane !== -1) {
        eggs.push({ lane: targetLane, y: spawnY, type: type, speed: finalSpeed });

        if (currentMode === 'chaos' && Math.random() < 0.25 && round > 2) {
          const otherLanes = availableLanes.filter(l => l !== targetLane);
          if (otherLanes.length > 0) {
            const lane2 = otherLanes[Math.floor(Math.random() * otherLanes.length)];
            if (isLaneFree(lane2, spawnY - 40, 100)) {
              eggs.push({ lane: lane2, y: spawnY - 40, type: Math.random() < 0.15 ? 'rotten' : 'normal', speed: finalSpeed * 0.9 });
            }
          }
        }
      }
    }, currentSpawnMs);
  }

  function updateHUD() {
    livesDisplay.textContent = '❤'.repeat(lives) || '💀';
    roundDisplay.textContent = round;
    scoreDisplay.textContent = score;
  }

  function gameLoop() {
    if (!running) return;
    update();
    draw();
    requestAnimationFrame(gameLoop);
  }

  function checkCatch(egg, pLane, pOffsetX = 0, pWidth = canvas.width) {
    const eggCenterX = egg.lane * LANE_WIDTH + LANE_WIDTH / 2;
    const playerCenterX = pOffsetX + pLane * LANE_WIDTH + LANE_WIDTH / 2;
    const playerTop = PLAYER_Y - PLAYER_H / 2;
    const playerBottom = PLAYER_Y + PLAYER_H / 2;
    return (egg.y + EGG_H >= playerTop && egg.y <= playerBottom && Math.abs(eggCenterX - playerCenterX) < LANE_WIDTH * 0.4);
  }

  function handleCatch(egg, eggCenterX) {
    if (egg.type === 'rotten') {
      lives--; if (lives < 0) lives = 0;
      combo = 0; updateHUD();
      sfxRotten(); triggerShake(8); triggerFlash(0.6); charlesScared = 1;
      if (navigator.vibrate) navigator.vibrate(120);
      spawnParticles(eggCenterX, PLAYER_Y - PLAYER_H / 2, '#6a8a6a');
      if (lives <= 0) return true;
    } else if (egg.type === 'bomb') {
      lives -= 2; if (lives < 0) lives = 0;
      combo = 0; updateHUD();
      sfxBomb(); triggerShake(18); triggerFlash(1); charlesScared = 1;
      if (navigator.vibrate) navigator.vibrate([200, 80, 200]);
      spawnParticles(eggCenterX, PLAYER_Y - PLAYER_H / 2, '#ff4400', 20);
      stats.bomb = (stats.bomb || 0) + 1;
      if (lives <= 0) return true;
    } else {
      let points = 10;
      if (egg.type === 'diamond') { points = 20; stats.diamond = (stats.diamond || 0) + 1; }
      if (egg.type === 'gold') {
        points = 15; stats.gold = (stats.gold || 0) + 1;
        if (lives < 5) { lives++; updateHUD(); }
        sfxGold(); spawnParticles(eggCenterX, PLAYER_Y - PLAYER_H / 2, GOLD_COLOR, 15);
      } else if (egg.type === 'diamond') {
        sfxDiamond(); spawnParticles(eggCenterX, PLAYER_Y - PLAYER_H / 2, DIAMOND_COLOR);
      } else {
        stats.eggs = (stats.eggs || 0) + 1;
        sfxCatch(); spawnParticles(eggCenterX, PLAYER_Y - PLAYER_H / 2, EGG_COLOR);
      }
      score += points; combo++;
      if (combo > comboBest) comboBest = combo;

      if (combo > (stats.maxCombo || 0)) {
        const diff = combo - (stats.maxCombo || 0);
        stats.totalCombo = (stats.totalCombo || 0) + diff;
        stats.maxCombo = combo;
      }

      if (combo > 0 && combo % 5 === 0) {
        score += 30; sfxCombo();
        comboDisplay.textContent = `🔥 Комбо x${combo}! +30`;
        triggerFlash(0.15);
      } else {
        comboDisplay.textContent = combo > 1 ? `Комбо: ${combo}` : '';
      }
      updateHUD();
    }
    return false;
  }

  function update() {
    if (gameOver) return;
    updateParticles();
    charlesBob += 0.05;
    if (charlesScared > 0) charlesScared -= 0.02;

    for (let i = eggs.length - 1; i >= 0; i--) {
      const egg = eggs[i];
      egg.y += egg.speed;
      const eggCenterX = egg.lane * LANE_WIDTH + LANE_WIDTH / 2;
      let caught = false;

      if (isDouble) {
        if (checkCatch(egg, playerLane, 0, canvas.width / 2)) caught = true;
        else if (checkCatch(egg, player2Lane, canvas.width / 2, canvas.width / 2)) caught = true;
      } else {
        if (checkCatch(egg, playerLane, 0, canvas.width)) caught = true;
      }

      if (caught) {
        const isDead = handleCatch(egg, eggCenterX);
        eggs.splice(i, 1);
        if (isDead) { saveStats(); triggerGameOver(); return; }
        continue;
      }

      if (egg.y > canvas.height + 20) {
        if (egg.type !== 'rotten' && egg.type !== 'bomb') {
          lives--; if (lives < 0) lives = 0;
          combo = 0; comboDisplay.textContent = '';
          updateHUD(); sfxRotten(); triggerFlash(0.4); charlesScared = 1;
          if (navigator.vibrate) navigator.vibrate(80);
          if (lives <= 0) { saveStats(); triggerGameOver(); return; }
        } else if (egg.type === 'rotten') {
          stats.rotten = (stats.rotten || 0) + 1;
        }
        eggs.splice(i, 1);
      }
    }

    if (score >= scoreForNextRound()) {
      round++;
      updateHUD();
      startSpawning();
      messageEl.textContent = `Раунд ${round}!`;
      triggerFlash(0.2);
    }
  }

  function triggerGameOver() {
    if (score < 30 && currentMode === 'classic') { triggerCheater(); return; }
    gameOver = true; running = false;
    if (spawnInterval) clearInterval(spawnInterval);
    sfxGameOver(); triggerShake(15); triggerFlash(0.8);
    if (navigator.vibrate) navigator.vibrate([150, 80, 150]);

    if (score > (records[currentMode] || 0)) {
      records[currentMode] = score;
      localStorage.setItem('charlesEgg_records', JSON.stringify(records));
      sfxRecord();
      updateRecordDisplay();
      messageEl.textContent = `🏆 Новый рекорд: ${score}! Комбо: ${comboBest}.`;
    } else {
      messageEl.textContent = `💀 Конец! Очки: ${score}. Рекорд: ${records[currentMode] || 0}.`;
    }
    saveStats(); checkUnlocks();
  }

  function triggerCheater() {
    cheaterMode = true; running = false; gameOver = true;
    stats.cheater = true; saveStats();
    if (spawnInterval) clearInterval(spawnInterval);
    cheaterLabels = [];
    for (let i = 0; i < 30; i++) {
      cheaterLabels.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: 14 + Math.random() * 26, color: Math.random() < 0.5 ? '#ff2020' : '#ffffff', alpha: 0.5 + Math.random() * 0.5 });
    }
    sfxBomb(); triggerShake(20); triggerFlash(1);
    if (navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 300]);
    messageEl.textContent = '💀 CHEATER! Чарльз знает. Нажми «Начать / Заново».';
    checkUnlocks();
  }

  function drawCharles(px, py, isScared) {
    const skin = SKINS[currentSkin] || SKINS['default'];
    const eyeOffset = isScared > 0 ? 1.5 : 0;
    const id = currentSkin; // Для проверки скинов Бойца и Солдата

    ctx.save();
    ctx.translate(px, py);

    // Невидимый скин (полностью прозрачный)
    if (skin.body === 'transparent' && skin.head === 'transparent') {
      ctx.restore(); return;
    }

    let bodyColor = skin.body;
    if (bodyColor === 'rainbow') {
      const grad = ctx.createLinearGradient(-PLAYER_W/2, 0, PLAYER_W/2, 0);
      grad.addColorStop(0, 'red'); grad.addColorStop(0.2, 'orange'); grad.addColorStop(0.4, 'yellow');
      grad.addColorStop(0.6, 'green'); grad.addColorStop(0.8, 'blue'); grad.addColorStop(1, 'violet');
      bodyColor = grad;
    }

    // Тело
    if (!skin.bombShape) {
      ctx.fillStyle = bodyColor;
      if (skin.eggShape) {
        ctx.beginPath(); ctx.ellipse(0, 0, PLAYER_W/2, PLAYER_H/1.5, 0, 0, Math.PI*2); ctx.fill();
      } else if (skin.skeleton) {
        ctx.fillStyle = bodyColor;
        ctx.fillRect(-4, -15, 8, 30); // Позвоночник
        for(let i=0; i<3; i++) ctx.fillRect(-12, -10 + i*8, 24, 3); // Рёбра
      } else if (skin.crystal) {
        ctx.fillStyle = '#220033';
        ctx.beginPath(); ctx.moveTo(0, -PLAYER_H/2); ctx.lineTo(PLAYER_W/2, 0); ctx.lineTo(0, PLAYER_H/2); ctx.lineTo(-PLAYER_W/2, 0); ctx.fill();
        ctx.strokeStyle = '#aa22ff'; ctx.lineWidth = 2; ctx.stroke();
      } else {
        ctx.fillRect(-PLAYER_W/2, -PLAYER_H/2, PLAYER_W, PLAYER_H);
        if (id === 'fighter') { ctx.fillStyle = '#ff0000'; ctx.fillRect(-15, 5, 30, 6); } // Красный пояс
        else if (id === 'soldier') { ctx.fillStyle = '#334433'; ctx.fillRect(-10, -10, 8, 8); ctx.fillRect(5, 0, 8, 8); } // Камуфляж
        else if (skin.star) {
          ctx.fillStyle = skin.star;
          ctx.beginPath();
          for(let i=0; i<5; i++) {
            const angle = -Math.PI/2 + i * Math.PI * 2 / 5;
            const x = Math.cos(angle) * 6, y = Math.sin(angle) * 6;
            if(i===0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          }
          ctx.fill();
        }
      }
    } else {
      // Бомбик
      ctx.fillStyle = BOMB_COLOR;
      ctx.beginPath(); ctx.arc(0, 0, PLAYER_W/2, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#ff4400'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, -PLAYER_H/2); ctx.lineTo(4, -PLAYER_H/2 - 8); ctx.stroke();
      ctx.fillStyle = '#ffaa00'; ctx.beginPath(); ctx.arc(4, -PLAYER_H/2 - 8, 3, 0, Math.PI*2); ctx.fill(); // Искра
    }

    // Голова
    if (skin.head !== 'transparent') {
      const headRadius = skin.bigHead ? 16 : 10;
      const headY = -PLAYER_H/2 - (skin.bigHead ? 8 : 6);
      
      ctx.fillStyle = skin.head;
      ctx.beginPath(); ctx.arc(0, headY, headRadius, 0, Math.PI*2); ctx.fill();

      if (skin.horns) {
        ctx.fillStyle = '#ff0000';
        ctx.beginPath(); ctx.moveTo(-6, headY - 6); ctx.lineTo(-12, headY - 15); ctx.lineTo(-2, headY - 8); ctx.fill();
        ctx.beginPath(); ctx.moveTo(6, headY - 6); ctx.lineTo(12, headY - 15); ctx.lineTo(2, headY - 8); ctx.fill();
      }

      if (!skin.noFace) {
        ctx.fillStyle = '#000';
        if (skin.eyes === 'all') {
          for(let i=0; i<8; i++) ctx.beginPath(), ctx.arc((Math.random()-0.5)*20, headY + (Math.random()-0.5)*15, 1.5, 0, Math.PI*2), ctx.fill();
        } else {
          const eyeCount = skin.eyes || 2;
          const eyeY = headY - 2;
          
          if (eyeCount === 3) { // Треугольник
            ctx.beginPath(); ctx.arc(-6, eyeY - 2, 2 + eyeOffset, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(6, eyeY - 2, 2 + eyeOffset, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(0, eyeY + 5, 2 + eyeOffset, 0, Math.PI*2); ctx.fill();
          } else if (eyeCount === 5) { // Крест
            ctx.beginPath(); ctx.arc(-6, eyeY - 3, 1.5 + eyeOffset, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(6, eyeY - 3, 1.5 + eyeOffset, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(0, eyeY - 3, 1.5 + eyeOffset, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(-4, eyeY + 4, 1.5 + eyeOffset, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(4, eyeY + 4, 1.5 + eyeOffset, 0, Math.PI*2); ctx.fill();
          } else { // 2 глаза
            ctx.beginPath(); ctx.arc(-4, eyeY, 2 + eyeOffset, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(4, eyeY, 2 + eyeOffset, 0, Math.PI*2); ctx.fill();
          }
        }
      }

      if (skin.scream) { ctx.fillStyle = '#000'; ctx.beginPath(); ctx.ellipse(0, headY + 4, 4, 6, 0, 0, Math.PI*2); ctx.fill(); }

      if (skin.halo) { ctx.strokeStyle = '#ffff00'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(0, headY - 12, 12, 4, 0, 0, Math.PI*2); ctx.stroke(); }
    }

    // Две/Три головы
    if (skin.heads && skin.heads > 1) {
      const headRadius = skin.bigHead ? 16 : 10;
      const headY = -PLAYER_H/2 - (skin.bigHead ? 8 : 6);
      
      for(let i=1; i<skin.heads; i++) {
        const offsetX = i % 2 === 0 ? 12 : -12;
        ctx.fillStyle = skin.head;
        ctx.beginPath(); ctx.arc(offsetX, headY, headRadius * 0.8, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(offsetX-3, headY - 2, 1.5, 0, Math.PI*2); ctx.arc(offsetX+3, headY - 2, 1.5, 0, Math.PI*2); ctx.fill();
      }
    }

    ctx.restore();
  }

  function draw() {
    ctx.save();
    if (shake > 0.5) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      shake *= 0.85; if (shake < 0.5) shake = 0;
    }
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(-50, -50, canvas.width + 100, canvas.height + 100);

    for (let i = 0; i <= LANES; i++) {
      ctx.beginPath(); ctx.strokeStyle = '#333'; ctx.lineWidth = 1;
      ctx.moveTo(i * LANE_WIDTH, 0); ctx.lineTo(i * LANE_WIDTH, canvas.height);
      ctx.stroke();
    }

    if (isDouble) {
      ctx.beginPath(); ctx.strokeStyle = '#ff4444'; ctx.lineWidth = 2;
      ctx.moveTo(canvas.width / 2, 0); ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
    }

    eggs.forEach(egg => {
      const x = egg.lane * LANE_WIDTH + LANE_WIDTH / 2 - EGG_W / 2;
      const y = egg.y;
      if (egg.type === 'normal') {
        ctx.fillStyle = EGG_COLOR; ctx.beginPath(); ctx.ellipse(x + EGG_W / 2, y + EGG_H / 2, EGG_W / 2, EGG_H / 2, 0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#aaa'; ctx.lineWidth = 1; ctx.stroke();
      } else if (egg.type === 'rotten') {
        ctx.fillStyle = ROTTEN_COLOR; ctx.beginPath(); ctx.ellipse(x + EGG_W / 2, y + EGG_H / 2, EGG_W / 2, EGG_H / 2, 0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#3a5a3a'; ctx.lineWidth = 1.5; ctx.beginPath();
        ctx.moveTo(x + 4, y + 8); ctx.lineTo(x + 10, y + 10); ctx.lineTo(x + 7, y + 18); ctx.stroke();
      } else if (egg.type === 'diamond') {
        ctx.fillStyle = DIAMOND_COLOR; ctx.beginPath();
        ctx.moveTo(x + EGG_W / 2, y); ctx.lineTo(x + EGG_W, y + EGG_H / 2); ctx.lineTo(x + EGG_W / 2, y + EGG_H); ctx.lineTo(x, y + EGG_H / 2); ctx.closePath(); ctx.fill();
      } else if (egg.type === 'gold') {
        ctx.fillStyle = GOLD_COLOR; ctx.beginPath(); ctx.ellipse(x + EGG_W / 2, y + EGG_H / 2, EGG_W / 2, EGG_H / 2, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.ellipse(x + EGG_W / 2 - 4, y + EGG_H / 2 - 4, 2, 4, 0, 0, Math.PI * 2); ctx.fill();
      } else if (egg.type === 'bomb') {
        ctx.fillStyle = BOMB_COLOR; ctx.beginPath(); ctx.arc(x + EGG_W / 2, y + EGG_H / 2, EGG_W / 2 + 2, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#ff4400'; ctx.lineWidth = 2; ctx.beginPath();
        ctx.moveTo(x + EGG_W / 2, y); ctx.lineTo(x + EGG_W / 2 + 4, y - 8); ctx.stroke();
        ctx.fillStyle = '#ffaa00'; ctx.beginPath(); ctx.arc(x + EGG_W / 2 + 4, y - 8, 3, 0, Math.PI * 2); ctx.fill();
      }
    });

    const py = PLAYER_Y + Math.sin(charlesBob) * 2;
    if (isDouble) {
      drawCharles(playerLane * LANE_WIDTH + LANE_WIDTH / 2, py, charlesScared);
      drawCharles(canvas.width / 2 + player2Lane * LANE_WIDTH + LANE_WIDTH / 2, py, charlesScared);
    } else {
      drawCharles(playerLane * LANE_WIDTH + LANE_WIDTH / 2, py, charlesScared);
    }

    particles.forEach(p => {
      ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    });
    ctx.globalAlpha = 1;

    if (gameOver && !cheaterMode) { ctx.fillStyle = 'rgba(150, 0, 0, 0.25)'; ctx.fillRect(-50, -50, canvas.width + 100, canvas.height + 100); }
    if (cheaterMode) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.55)'; ctx.fillRect(-50, -50, canvas.width + 100, canvas.height + 100);
      cheaterLabels.forEach(label => {
        ctx.globalAlpha = label.alpha; ctx.fillStyle = label.color;
        ctx.font = `bold ${label.size}px 'Courier New', monospace`;
        ctx.fillText('CHEATER', label.x, label.y);
      });
      ctx.globalAlpha = 1;
    }
    if (flash > 0.01) {
      ctx.fillStyle = `rgba(255, 40, 40, ${flash})`;
      ctx.fillRect(-50, -50, canvas.width + 100, canvas.height + 100);
      flash *= 0.88; if (flash < 0.01) flash = 0;
    }
    ctx.restore();
  }

  checkUnlocks();
  draw();
</script>
</body>
</html>
